# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: cerebro
metadata:
  template: cerebro@1.0.0
services:
  api:
    project: ./src/RagApp.Functions
    language: dotnet
    host: function
  web:
    project: ./src/web
    language: js
    host: staticwebapp
    dist: dist
hooks:
  # ARM writes App Configuration key-values over the *data* plane, which it cannot reach
  # through a private endpoint unless the deployment itself runs inside the VNet. The store
  # is therefore opened before provisioning (local auth stays disabled, so Entra RBAC is
  # still enforced) and closed again once the key-values are written.
  preprovision:
    windows:
      shell: pwsh
      continueOnError: false
      run: ./scripts/unlock-appconfig-network.ps1
    posix:
      shell: sh
      continueOnError: false
      run: ./scripts/unlock-appconfig-network.sh
  postprovision:
    windows:
      shell: pwsh
      continueOnError: false
      run: ./scripts/lock-appconfig-network.ps1
    posix:
      shell: sh
      continueOnError: false
      run: ./scripts/lock-appconfig-network.sh
